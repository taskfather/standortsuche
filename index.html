<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standortsuche</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header class="glass topbar">
    <div class="brand">Standortsuche</div>
    <nav class="seg" id="nav">
      <button type="button" data-view="flaechen" class="on">Flächen</button>
      <button type="button" data-view="bericht">Bericht</button>
      <button type="button" data-view="strom">Strom</button>
    </nav>
    <div class="counts" id="counts"></div>
    <label class="mandate">
      <select id="mandate" aria-label="Auftrag"></select>
    </label>
    <button type="button" class="live" id="live">
      <span class="dot"></span>
      <span id="live-text">Bereit</span>
    </button>
  </header>

  <aside class="glass dock dock-left">
    <section id="panel-flaechen" class="panel on">
      <div class="dock-head">
        <div>
          <p class="kicker">Auftrag</p>
          <h1 id="mandate-title"></h1>
          <p id="mandate-meta"></p>
        </div>
        <button type="button" class="pill" id="next">Nächste Fläche</button>
      </div>
      <div class="filters" id="filters"></div>
      <div id="list"></div>
      <div class="runlog" id="runlog"></div>
    </section>
    <section id="panel-bericht" class="panel reader"></section>
    <section id="panel-strom" class="panel reader"></section>
  </aside>

  <aside class="glass dock dock-right" id="dock-right">
    <div id="file"></div>
    <section class="chat">
      <div class="chat-head">
        <h2>Gespräch</h2>
        <p id="chat-context">Zum ganzen Auftrag</p>
      </div>
      <div id="chat-log"></div>
      <form id="chat-form" class="composer">
        <input id="chat-input" type="text" placeholder="Nachricht schreiben" autocomplete="off">
        <button type="submit" aria-label="Senden">↑</button>
      </form>
    </section>
  </aside>

  <div class="map-pills">
    <div class="glass seg" id="basemap">
      <button type="button" data-base="map" class="on">Karte</button>
      <button type="button" data-base="sat">Satellit</button>
    </div>
    <div class="glass seg" id="layers">
      <button type="button" data-layer="parcels" class="on"><i class="swatch parcel"></i>Flächen</button>
      <button type="button" data-layer="live" class="on"><i class="swatch live"></i>Bestehend</button>
      <button type="button" data-layer="plan" class="on"><i class="swatch plan"></i>Geplant</button>
    </div>
  </div>

  <div class="glass zoomer">
    <button type="button" id="zoom-in" aria-label="Näher">+</button>
    <button type="button" id="zoom-out" aria-label="Weiter">−</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
