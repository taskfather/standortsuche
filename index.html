<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standortsuche</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <div id="map"></div>

  <header class="glass topbar">
    <div class="brand">Standortsuche</div>
    <nav class="seg" id="nav">
      <button type="button" data-view="karte" class="on">Karte</button>
      <button type="button" data-view="akten">Akten</button>
      <button type="button" data-view="bericht">Bericht</button>
      <button type="button" data-view="strom">Strom</button>
    </nav>
    <div class="counts" id="counts"></div>
    <button type="button" class="live" id="live">
      <span class="dot"></span>
      <span id="live-text">Bereit</span>
    </button>
  </header>

  <aside class="glass dock dock-left" id="dock-left">
    <div id="pane" class="pane"></div>
  </aside>

  <button type="button" class="edge-toggle" id="right-toggle" aria-label="Rechts einklappen">›</button>
  <aside class="glass dock dock-right" id="dock-right">
    <section class="chat">
      <div class="chat-head">
        <h2>Gespräch</h2>
        <p id="chat-context">Alle Akten</p>
      </div>
      <div id="chat-log"></div>
      <form id="chat-form" class="composer">
        <input id="chat-input" type="text" placeholder="Akte, Karte oder Quelle ansprechen" autocomplete="off">
        <button type="submit" aria-label="Senden">↑</button>
      </form>
    </section>
  </aside>

  <div class="map-pills">
    <div class="glass seg" id="basemap">
      <button type="button" data-base="map" class="on">Karte</button>
      <button type="button" data-base="sat">Satellit</button>
    </div>
    <div class="glass seg" id="layers">
      <button type="button" data-layer="parcels" class="on"><i class="swatch parcel"></i>Flächen</button>
      <button type="button" data-layer="live" class="on"><i class="swatch live"></i>Bestehend</button>
      <button type="button" data-layer="plan" class="on"><i class="swatch plan"></i>Geplant</button>
    </div>
  </div>

  <div class="glass zoomer">
    <button type="button" id="zoom-in" aria-label="Näher">+</button>
    <button type="button" id="zoom-out" aria-label="Weiter">−</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
